name: Build ARS USD CNY USDT APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ARSYuanConverter_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack app source
        run: |
          test -f ARSYuanConverter_OneUpload.zip
          mkdir -p source
          unzip -q ARSYuanConverter_OneUpload.zip -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle
          test -f source/app/src/main/AndroidManifest.xml

      - name: Unit-test exchange-rate calculations
        run: |
          mkdir -p /tmp/fx-unit-tests
          javac -d /tmp/fx-unit-tests \
            source/app/src/main/java/com/exchange/arsusdcny/FxCalculator.java \
            source/app/src/main/java/com/exchange/arsusdcny/UsdtCalculator.java \
            source/tests/FxCalculatorTest.java \
            source/tests/UsdtCalculatorTest.java
          java -cp /tmp/fx-unit-tests FxCalculatorTest
          java -cp /tmp/fx-unit-tests UsdtCalculatorTest

      - name: Compile Android APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp source/app/build/outputs/apk/debug/app-debug.apk dist/ARS_USD_CNY_USDT_Rates_v1.1-debug.apk
          sha256sum dist/ARS_USD_CNY_USDT_Rates_v1.1-debug.apk

      - name: Upload APK download artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARS-USD-CNY-USDT-Rates-APK
          path: dist/ARS_USD_CNY_USDT_Rates_v1.1-debug.apk
          if-no-files-found: error
          retention-days: 30
